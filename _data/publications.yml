    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:7PzlFSSx8tAC"
    code_url:
    project_url:
    abstract: >-
      TinyRXNet combines SAM-derived features with Local RX blocks to improve segmentation of very small objects, including pedestrians in top-down UAV imagery.

