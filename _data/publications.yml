items:
  color-aware-fashion-reranking:
    id: color-aware-fashion-reranking
    url: /publications/color-aware-fashion-reranking/
    title: "Color-Aware Re-Ranking for Fashion Image Retrieval"
    description: A NomadLab conference publication at ICCDE 2026.
    venue: ICCDE 2026
    venue_type: Conference
    authors:
      - enis-teper
      - ilayda-kara
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1145/3801839.3801868
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:TFP_iSt0sucC"
    code_url:
    project_url:
    abstract: >-
      Color plays a central role in fashion perception and user preference, yet modern embedding-based image retrieval systems primarily optimize for semantic and structural similarity, often neglecting chromatic coherence. As a result, retrieved garments may be category-correct but visually inconsistent in color. This paper introduces CA-Rank, a segmentation-driven, model-agnostic post-retrieval framework that enhances fashion image retrieval by explicitly incorporating perceptual color similarity.Each image is first processed by a class-agnostic segmentation model to isolate garment pixels, ensuring that both embeddings and color descriptors are computed on garment-only regions. CA-Rank evaluates two color similarity strategies:Weighted Color Matching (WCM), which compares discrete HSV-based color compositions, and Weighted Chamfer Similarity (WCS), which operates in the CIE-LAB color space on quantized palettes using a symmetric, weight-aware Chamfer formulation. While WCM provides a simple baseline, WCS demonstrates substantially higher robustness to illumination, mixed hues, and fine-grained chromatic variation; therefore, the final re-ranking relies on WCS to refine the top-K candidates without any additional training or modification of the underlying retrieval model. Experiments on a segmented subset of the In-Shop Clothes Retrieval benchmark show consistent improvements in Hit@K across diverse backbones, with the largest gains at top ranks where users are most sensitive to color mismatches. Qualitative analyses further indicate that CA-Rank produces retrieval results that are both semantically accurate and perceptually color-consistent, offering a simple and effective mechanism for improving the visual coherence of fashion search systems.


  occlusion-aware-face-retrieval:
    id: occlusion-aware-face-retrieval
    url: /publications/occlusion-aware-face-retrieval/
    title: "Occlusion-Aware Face Retrieval: Identity Restoration through Generative Inpainting"
    description: A NomadLab conference publication at AICCC 2025.
    venue: AICCC 2025
    venue_type: Conference
    authors:
      - enis-teper
      - selcuk-acikalin
      - yunus-emre-gundogmus
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1145/3789982.3790067
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:r0BpntZqJG4C"
    code_url:
    project_url:
    abstract: >-
      Occlusions remain a major obstacle for reliable face recognition and person re-identification, as they obscure critical identity features and distort embedding representations. In this work, we present a unified and reproducible pipeline for evaluating both the impact of occlusion and the effectiveness of generative inpainting in restoring identity-preserving facial information. Using the LFW dataset, we generate realistic occlusions via semantically guided masks with Stable Diffusion, and subsequently apply state-of-the-art inpainting methods for occlusion removal. Reconstruction quality is assessed using a comprehensive set of structural and perceptual metrics, while identity preservation is evaluated through retrieval experiments across diverse embedding architectures representing both supervised and self-supervised learning paradigms. Experimental results demonstrate that inpainting can significantly mitigate the adverse effects of occlusion on retrieval performance. Furthermore, our findings reveal that conventional perceptual metrics do not fully capture identity consistency, highlighting the need for embedding-aware evaluation. This study offers a complete benchmarking framework and cross-model analysis to advance research on occlusion-robust face recognition.


  self-supervised-jigsaw-change-detection:
    id: self-supervised-jigsaw-change-detection
    url: /publications/self-supervised-jigsaw-change-detection/
    title: "Enhancing Change Detection with Self-Supervised Jigsaw Loss"
    description: A NomadLab conference publication at AICCC 2025.
    venue: AICCC 2025
    venue_type: Conference
    authors:
      - ayberk-gurses
      - berke-algul
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1145/3789982.3790069
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:j3f4tGmQtD8C"
    code_url:
    project_url:
    abstract: >-
      The ability of humans to adapt is dependent on learning from both labeled data and unlabeled experiences. Since supervised learning is inherently limited and cannot encompass all scenarios, the integration of unsupervised learning is essential since it allows models to uncover underlying patterns and invariances that aid in broader generalization. Inspired by this principle, we present a novel method for tackling change detection that blends supervised semantic segmentation with a complementary self-supervised objective. Specifically, our method not only identifies changed pixels in images, but also enhances spatial reasoning by training the model to solve jigsaw puzzles constructed from shuffled segmentation masks. We introduce Jigsaw Change Detection (JCD), a dual-task architecture designed to leverage spatial structure within the data. The auxiliary deshuffling task encourages the model to learn spatial dependencies, effectively regularizing the primary segmentation process. The integration of these tasks leads to improved performance in change detection. Our extensive evaluations across CDD, SYSU, and NJDS benchmarks demonstrate the effectiveness of our approach, consistently outperforming existing methods. Code is made publicly accessible at https://github.com/berkealgul/JDS.

  neonatal-mri-kspace-lesion-segmentation:
    id: neonatal-mri-kspace-lesion-segmentation
    url: /publications/neonatal-mri-kspace-lesion-segmentation/
    title: "Lesion Segmentation of Neonatal Diffusion MRI Under Simulated K-space Undersampling"
    description: A NomadLab conference publication at AICCC 2025.
    venue: AICCC 2025
    venue_type: Conference
    authors:
      - a-senih-yildirim
      - ayca-pektas
      - busra-koyun
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1145/3789982.3790068
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:4JMBOYKVnBMC"
    code_url:
    project_url:
    abstract: >-
      Accurate segmentation of Hypoxic Ischemic Encephalopathy (HIE) lesions in neonatal diffusion MRI remains challenging due to the small, diffuse nature of the lesions and the constraints of accelerated imaging. Detecting such tiny lesions becomes particularly difficult when MRIs are acquired at very low spatial resolutions. In this study, we address the task of lesion segmentation from low-resolution MR images by simulating realistic clinical conditions through 4-fold equispaced undersampling of Apparent Diffusion Coefficient (ADC) and Z-score ADC (ZADC) volumes from the BONBID-HIE dataset. Paired aliased images are generated via inverse Fourier reconstruction, and three segmentation models are trained under these settings (i) a baseline SwinUNETR, (ii) a DCT-enhanced model incorporating global frequency representations, and (iii) a variant integrating localized (block-based) DCT into early encoder layers. Experimental results demonstrate that lesion segmentation from undersampled images is feasible, and that incorporating frequency-domain priors significantly improves performance. Our findings highlight the advantages of combining transformer-based architectures with frequency-aware augmentation for robust neonatal brain lesion segmentation under limited k-space sampling.
      

  skewfuse:
    id: skewfuse
    url: /publications/skewfuse/
    title: "SkewFuse: Unsupervised Confidence-Guided Rank Fusion for Multi-View Image Retrieval"
    description: A NomadLab conference publication at ICMLA 2025.
    venue: ICMLA 2025
    venue_type: Conference
    authors:
      - enis-teper
      - mustafa-keskin
      - emre-rencberoglu
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1109/ICMLA66185.2025.00036
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:RHpTSmoSYBkC"
    code_url:
    project_url:
    abstract: >-
      In image retrieval systems, the use of multiple embedding models to capture diverse visual features often improves retrieval performance. However, traditional rank aggregation methods generally assume uniform reliability across retrieval models, neglecting the variability in model confidence across different queries. This paper introduces SkewFuse, an unsupervised rank fusion approach that dynamically weights retrieval results based on statistical skewness of similarity score distributions, effectively capturing query-specific confidence. We extend the Dowdall positional voting method by integrating these confidence weights, achieving adaptive and robust fusion. Evaluations conducted on the In-Shop Clothes Retrieval dataset demonstrate that SkewFuse consistently outperforms existing unsupervised and supervised fusion methods, notably improving early precision metrics, including a 4.7% relative gain in Recall@1 over the strongest baseline. SkewFuse offers an efficient, parameter-light solution ideal for real-world applications where top-ranked retrieval precision is critical.

  retrieval-oriented-dimensionality-reduction:
    id: retrieval-oriented-dimensionality-reduction
    url: /publications/retrieval-oriented-dimensionality-reduction/
    title: "Image Retrieval through Retrieval-Oriented Dimensionality Reduction"
    description: A NomadLab conference publication at ISMSIT 2025.
    venue: ISMSIT 2025
    venue_type: Conference
    authors:
      - enis-teper
      - alp-arda-yalman
      - dilge-karakas
      - serena-tomakyan
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1109/ISMSIT67332.2025.11268102
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:R3hNpaxXUhUC"
    code_url:
    project_url:
    abstract: >-
      Large-scale fashion image retrieval relies on high-dimensional embeddings that improve accuracy but introduce significant computational and storage costs. Dimensionality reduction offers a solution, yet many methods degrade retrieval quality by failing to preserve neighborhood structure. We evaluate linear, nonlinear, and neural approaches across state-of-the-art backbones on the DeepFashion In-Shop dataset, finding PCA to be a strong baseline while naive autoencoders perform poorly. To address this, we propose the MCDO Loss, a hybrid objective combining reconstruction fidelity, cosine similarity preservation, bottleneck decorrelation, and orthogonality regularization. Experiments show that AE-MCDO consistently outperforms PCA and MSE-based autoencoders, achieving higher Hit@K with more compact representations, thus enabling efficient and accurate large-scale fashion search.

  football-playing-styles-isace:
    id: football-playing-styles-isace
    url: /publications/football-playing-styles-isace/
    title: "How Do Football Teams Play? A Deep Embedded Clustering Approach to Reveal Playing Styles"
    description: A NomadLab conference publication in the ISACE 2025 proceedings.
    venue: ISACE 2025
    venue_type: Conference
    authors:
      - ege-demir
      - yusuf-huseyin-sahin
      - nazim-kemal-ure
    paper_url: https://doi.org/10.1007/978-3-032-06167-6_4
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:dhFuZR0502QC"
    code_url:
    project_url:
    abstract: >-
      This study proposes a novel approach to clustering football teams’ playing styles using a Deep Embedded Clustering (DEC) algorithm applied to large-scale event data. The dataset comprises over 3 million events from 1,826 matches played in the top-tier leagues of England, Spain, Italy, Germany, and France during the 2016/2017 season. Each match event, such as passes, shots, and duels, contributes to a comprehensive representation of team behavior on the field. To capture tactical nuances, the dataset is segmented into four distinct phases of play, and each phase is clustered independently. These intermediate clustering results are aggregated to create a feature representation for each team, which is subsequently clustered to reveal dominant playing styles. A detailed feature engineering process, inspired by recent literature, incorporates spatial and temporal elements of play, including pass motifs, positional tendencies, and graph-based metrics. The resulting clusters are evaluated in terms of their clustering quality, measured by Silhouette, A(C)1, and A(C)2 scores, their predictive utility for match outcomes, and their tactical interpretability. The analysis demonstrates clear performance disparities among styles, offering insights into the effectiveness of specific tactical schemas. This methodology enables data-driven tactical analysis and benchmarking in football, highlighting the potential of unsupervised learning, particularly deep clustering, to inform strategic decision-making in sports analytics. The source code of this study is available at https://github.com/egecjdemir/how_football_teams_play.



  open-vocabulary-product-discovery:
    id: open-vocabulary-product-discovery
    url: /publications/open-vocabulary-product-discovery/
    title: "Open-Vocabulary Product Discovery via Fusion Based Visual Retrieval in E-Commerce"
    description: A NomadLab conference publication at UBMK 2025.
    venue: UBMK 2025
    venue_type: Conference
    authors:
      - enis-teper
      - mustafa-keskin
      - emre-rencberoglu
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1109/UBMK67458.2025.11206995
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:L8Ckcad2t8MC"
    code_url:
    project_url:
    abstract: >-
      In e-commerce, users often seek complementary products that appear together in the same scene, but existing visual search systems face scalability challenges. Traditional approaches rely on class-specific object detectors and supervised metric-learning models that require re-training and re-annotation for each new product category. Consequently, this reliance on manually labeled datasets limits adaptability in dynamic marketplace environments. We propose an end-to-end pipeline that addresses these constraints through open-vocabulary object detection combined with a novel freeze-weighted reciprocal rank fusion (FWRRF) retrieval strategy. Our system employs YOLO-World for prompt-driven product detection, enabling zero-shot recognition of unseen categories without additional training or annotations. The retrieval module extracts dual-view embeddings from both detected object crops and full scene images, then combines them using FWRRF, a lightweight fusion method that preserves high-precision object-centric results while incorporating contextual information through weighted reciprocal ranking. Evaluation on a curated living-room dataset demonstrates strong performance 0.851 mAP@0.5 for detection and Recall@3 = 0.580 for retrieval, surpassing single-view baselines and conventional fusion methods. This framework enables scalable, prompt-driven product discovery with continuous category expansion capabilities, eliminating costly retraining cycles in dynamic e-commerce environments.


  tinyrxnet:
    id: tinyrxnet
    url: /publications/tinyrxnet/
    title: "TinyRXNet: A Local RX-Based Architecture for Accurate Segmentation of Small-Scale Objects"
    description: A NomadLab conference publication at UBMK 2025.
    venue: UBMK 2025
    venue_type: Conference
    authors:
      - nazrin-abdinli
      - yusuf-huseyin-sahin
    paper_url: https://doi.org/10.1109/UBMK67458.2025.11206877
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:7PzlFSSx8tAC"
    code_url:
    project_url:
    abstract: >-
      Segmenting tiny objects in high-resolution images, such as pedestrians in aerial views, poses major challenges due to their small size and limited contextual information. Existing segmentation models often fail to capture these fine details accurately. However, such small objects often appear as localized anomalies within the scene—distinct from their surroundings in feature space—which makes local anomaly detection methods like Local Reed-Xialoi (RX) detector, particularly effective for highlighting them. Thus, we introduce TinyRXNet, a novel deep segmentation network that combines SAM-based feature encoding with Local RX blocks, which apply localized anomaly scoring to highlight distinctive regions. This RX-based attention mechanism helps the model focus on areas that deviate from their surroundings, improving segmentation performance. Evaluated on the TinyPedSeg dataset, TinyRXNet outperforms standard baselines, demonstrating the effectiveness of combining deep features with spatial anomaly cues for tiny object segmentation. The codes are available at https://anonymous.4open.science/r/TINYRXNET-693B/

  itaclip:
    id: itaclip
    url: /publications/itaclip/
    title: "ITACLIP: Boosting Training-Free Semantic Segmentation with Image, Text, and Architectural Enhancements"
    description: A NomadLab workshop publication at CVPR Workshops 2025.
    venue: CVPR Workshops 2025
    venue_type: Workshop
    authors:
      - m-arda-aydin
      - efe-mert-cirpar
      - elvin-abdinli
      - gozde-unal
      - yusuf-huseyin-sahin
    paper_url: https://openaccess.thecvf.com/content/CVPR2025W/PixFoundation/html/Aydin_ITACLIP_Boosting_Training-Free_Semantic_Segmentation_with_Image_Text_and_Architectural_CVPRW_2025_paper.html
    scholar_url: "https://scholar.google.com/citations?view_op=view_citation&hl=tr&user=62rdgoYAAAAJ&sortby=pubdate&citation_for_view=62rdgoYAAAAJ:qxL8FJ1GzNcC"
    code_url: https://github.com/m-arda-aydn/ITACLIP
    project_url:
    abstract: >-
      Recent advances in foundational Vision Language Models (VLMs) have reshaped the evaluation paradigm in computer vision tasks. These foundational models, especially CLIP, have accelerated research in open-vocabulary computer vision tasks, including Open-Vocabulary Semantic Segmentation (OVSS). Although the initial results are promising, the dense prediction capabilities of VLMs still require further improvement. In this study, we enhance the semantic segmentation performance of CLIP by introducing new modules and modifications. 1) architectural changes in the last layer of ViT and the incorporation of attention maps from the middle layers with the last layer, 2) Image Engineering. applying data augmentations to enrich input image representations, and 3) using Large Language Models (LLMs) to generate definitions and synonyms for each class name to leverage CLIP's open-vocabulary capabilities. Our training-free method, ITACLIP, outperforms current state-of-the-art approaches on five popular segmentation benchmarks. Our code is available at https://github.com/m-arda-aydn/ITACLIP.


